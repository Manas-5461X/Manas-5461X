name: refresh stats

# Deliberately no `push` trigger: this job commits SVGs, and a push
# trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install card dependencies
        run: pip install requests beautifulsoup4

      - name: Draw the monochrome stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Scrape real contribution data for cards
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/fetch_contributions.py

      - name: Render README cards (hero, heatmap, activity, achievements, repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/render_readme_cards.py

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=dracula&no-frame=true&no-bg=true&margin-w=4&row=1&column=7'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit whatever changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg trophy.svg data/contributions.json data/stats.json cards/*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          for attempt in 1 2 3; do
            git pull origin main --rebase
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
