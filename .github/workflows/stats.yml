name: refresh stats

# Deliberately no `push` trigger: this job commits SVGs, and a push
# trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=dracula&no-frame=true&no-bg=true&margin-w=4&row=1&column=7'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit whatever changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg trophy.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git pull --rebase
          git push
